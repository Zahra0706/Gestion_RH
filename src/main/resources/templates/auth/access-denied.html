<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accès Refusé - HR Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="text-center">Accès Refusé</h3>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="fas fa-ban fa-5x text-danger"></i>
                    </div>
                    <h4>Vous n'avez pas les permissions nécessaires pour accéder à cette page.</h4>
                    <p class="text-muted">Veuillez contacter votre administrateur si vous pensez qu'il s'agit d'une erreur.</p>
                    <div class="mt-4">
                        <a th:href="@{/auth/login}" class="btn btn-primary">Retour à la connexion</a>
                        <a th:href="@{/redirect-by-role}" class="btn btn-secondary">Retour au tableau de bord</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
