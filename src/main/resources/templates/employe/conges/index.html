<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{employe/header :: head}">
    <title>Mes Congés</title>
</head>
<body>
<div th:replace="~{employe/menu :: sidebar}"></div>

<main class="main-content">
    <div th:replace="~{employe/header :: employe-header}" th:with="pageTitle='Mes Congés'"></div>

    <div class="container-fluid">

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="badge bg-info">
                    Jours restants: <span th:text="${#numbers.formatDecimal(joursRestants, 1, 0)}">0</span>
                </span>
            </div>
            <a class="btn btn-primary" th:href="@{/employe/conges/nouveau}">
                <i class="fas fa-plus me-1"></i> Nouvelle demande
            </a>
        </div>

        <div class="card">
            <div class="card-header">
                <strong>Historique</strong>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                        <th>Du</th>
                        <th>Au</th>
                        <th>Type</th>
                        <th>Statut</th>
                        <th>Motif</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(conges)}">
                        <td colspan="5" class="text-center text-muted p-4">Aucune demande pour le moment.</td>
                    </tr>

                    <tr th:each="c : ${conges}">
                        <td th:text="${#temporals.format(c.dateDebut, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(c.dateFin, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span th:class="${'badge ' + (
                                c.typeConge.name() == 'PAYE' ? 'bg-success' :
                                c.typeConge.name() == 'MALADIE' ? 'bg-danger' :
                                c.typeConge.name() == 'SANS_SOLDE' ? 'bg-secondary' :
                                'bg-info'
                            )}" th:text="${c.typeConge.name()}"></span>
                        </td>
                        <td>
                            <span th:class="${'badge ' + (
                                c.statut.name() == 'EN_ATTENTE_MANAGER' ? 'bg-warning text-dark' :
                                c.statut.name() == 'VALIDE_MANAGER' ? 'bg-info text-dark' :
                                c.statut.name() == 'EN_ATTENTE_RH' ? 'bg-info text-dark' :
                                c.statut.name() == 'VALIDE_RH' ? 'bg-success' :
                                c.statut.name() == 'REFUSE_MANAGER' ? 'bg-danger' :
                                c.statut.name() == 'REFUSE_RH' ? 'bg-danger' :
                                c.statut.name() == 'ANNULE' ? 'bg-secondary' :
                                'bg-secondary'
                            )}">
                                <span th:switch="${c.statut.name()}">
                                    <span th:case="'EN_ATTENTE_MANAGER'">En attente Manager</span>
                                    <span th:case="'VALIDE_MANAGER'">Validé Manager (Attente RH)</span>
                                    <span th:case="'EN_ATTENTE_RH'">En attente RH</span>
                                    <span th:case="'VALIDE_RH'">Validé RH</span>
                                    <span th:case="'REFUSE_MANAGER'">Refusé Manager</span>
                                    <span th:case="'REFUSE_RH'">Refusé RH</span>
                                    <span th:case="'ANNULE'">Annulé</span>
                                    <span th:case="*" th:text="${c.statut}">STATUT</span>
                                </span>
                            </span>
                        </td>
                        <td th:text="${c.motif}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
