<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HR Manager - Espace Employé</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Même CSS que Admin -->
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">

    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>

<body>
<div th:fragment="employe-header">
    <div class="admin-header">
        <div class="header-left">
            <button class="btn btn-outline-secondary d-md-none menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0" th:text="${pageTitle ?: 'Espace Employé'}"></h4>
            <small class="text-muted" sec:authorize="hasRole('EMPLOYE')">Employé</small>
        </div>

        <div class="user-info">
            <div th:if="${employe != null}" class="user-avatar"
                 th:text="${#strings.substring(employe.nom, 0, 1) + #strings.substring(employe.prenom, 0, 1)}">
                EM
            </div>
            <div th:if="${employe != null}">
                <div class="fw-bold" th:text="${employe.prenom + ' ' + employe.nom}"></div>
                <small class="text-muted" th:text="${employe.role}">EMPLOYE</small>
            </div>

            <div th:if="${employe == null}" class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div th:if="${employe == null}">
                <div class="fw-bold" sec:authentication="name"></div>
                <small class="text-muted">Utilisateur</small>
            </div>

            <div class="dropdown">
                <button class="btn btn-link text-dark" type="button" data-bs-toggle="dropdown">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" th:href="@{/employe/profil}">
                            <i class="fas fa-user me-2"></i>Mon Profil
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/auth/logout}" method="post">
                            <button class="dropdown-item text-danger" type="submit">
                                <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

        </div>
    </div>
</div>
</body>
</html>
