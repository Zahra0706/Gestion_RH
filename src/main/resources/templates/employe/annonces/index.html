<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="employe/header :: head">
    <title>Annonces</title>
</head>
<body>
<div th:replace="employe/menu :: sidebar"></div>

<main class="main-content">
    <div th:replace="employe/header :: employe-header" th:with="pageTitle='Annonces'"></div>

    <div class="container-fluid">

        <div class="alert alert-info" th:if="${annonces == null || #lists.isEmpty(annonces)}">
            Aucune annonce pour le moment.
        </div>

        <div class="row g-3" th:if="${annonces != null && !#lists.isEmpty(annonces)}">

            <div class="col-12 col-md-6 col-lg-4" th:each="a : ${annonces}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <h5 class="card-title mb-1" th:text="${a.titre}">Titre</h5>
                            <span class="badge bg-secondary"
                                  th:text="${a.departement != null ? a.departement.nom : 'Générale'}">
                                Générale
                            </span>
                        </div>

                        <div class="text-muted small mb-2"
                             th:text="${a.dateCreation != null ? a.dateCreation : ''}">
                        </div>

                        <p class="card-text" th:text="${a.contenu}">
                            Contenu de l'annonce...
                        </p>
                    </div>
                </div>
            </div>

        </div>

    </div>
</main>
</body>
</html>
