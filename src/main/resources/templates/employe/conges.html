<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{rh/layouts/base :: layout(title='Mes Congés', content=~{::section})}">

<head>
    <title>Mes Congés</title>
</head>

<body>
    <section>
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Mes Congés</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/employe/conges/demander" class="btn btn-sm btn-primary">
                    <i class="fas fa-plus me-1"></i> Nouvelle Demande
                </a>
            </div>
        </div>

        <!-- Filtres (Optionnel) -->
        <!-- <div class="row mb-3">...</div> -->

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Type</th>
                                <th>Dates</th>
                                <th>Durée</th>
                                <th>Statut</th>
                                <th>Motif</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="conge : ${conges}">
                                <td>
                                    <span class="badge" th:classappend="${conge.typeConge.name() == 'PAYE'} ? 'bg-success' :
                                                  (${conge.typeConge.name() == 'MALADIE'} ? 'bg-danger' : 'bg-info')"
                                        th:text="${conge.typeConge}">Type</span>
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(conge.dateDebut, 'dd/MM/yyyy')}"></span>
                                    <i class="fas fa-arrow-right mx-1 text-muted small"></i>
                                    <span th:text="${#temporals.format(conge.dateFin, 'dd/MM/yyyy')}"></span>
                                </td>
                                <td th:text="${conge.nombreJours} + ' jours'"></td>
                                <td>
                                    <!-- Statuts -->
                                    <span th:switch="${conge.statut.name()}">
                                        <span th:case="'VALIDE_RH'" class="badge bg-success rounded-pill"><i
                                                class="fas fa-check me-1"></i>Validé</span>
                                        <span th:case="'REFUSE_RH'" class="badge bg-danger rounded-pill"><i
                                                class="fas fa-times me-1"></i>Refusé RH</span>
                                        <span th:case="'REFUSE_MANAGER'" class="badge bg-danger rounded-pill"><i
                                                class="fas fa-times me-1"></i>Refusé Manager</span>
                                        <span th:case="'VALIDE_MANAGER'" class="badge bg-info text-dark rounded-pill"><i
                                                class="fas fa-check-double me-1"></i>Validé Manager</span>
                                        <span th:case="'EN_ATTENTE_MANAGER'"
                                            class="badge bg-warning text-dark rounded-pill"><i
                                                class="fas fa-clock me-1"></i>Attente Manager</span>
                                        <span th:case="'EN_ATTENTE_RH'"
                                            class="badge bg-warning text-dark rounded-pill"><i
                                                class="fas fa-clock me-1"></i>Attente RH</span>
                                        <span th:case="'EN_ATTENTE_INFO'"
                                            class="badge bg-warning text-dark rounded-pill"><i
                                                class="fas fa-question me-1"></i>Info Requise</span>
                                        <span th:case="'ANNULE'" class="badge bg-secondary rounded-pill">Annulé</span>
                                        <span th:case="*" class="badge bg-secondary" th:text="${conge.statut}"></span>
                                    </span>
                                </td>
                                <td>
                                    <!-- Affichage conditionnel des motifs/commentaires -->
                                    <small th:if="${conge.statut.name().contains('REFUSE')}" class="text-danger">
                                        <i class="fas fa-info-circle me-1"></i>
                                        <span
                                            th:text="${conge.commentaireRH != null ? conge.commentaireRH : (conge.commentaireManager != null ? conge.commentaireManager : 'Aucun motif')}">Motif</span>
                                    </small>
                                    <small th:if="${conge.statut.name() == 'VALIDE_RH'}" class="text-success">
                                        <i class="fas fa-check-circle me-1"></i>Approuvé
                                    </small>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <!-- Bouton Détails (TODO: implémenter vue détails employé) -->
                                        <!-- <a href="#" class="btn btn-outline-secondary"><i class="fas fa-eye"></i></a> -->

                                        <a th:if="${conge.statut.name() == 'EN_ATTENTE_MANAGER'}" href="#"
                                            class="btn btn-outline-danger" title="Annuler">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(conges)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-mug-hot fa-2x mb-3"></i>
                                    <p>Vous n'avez aucune demande de congé.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
