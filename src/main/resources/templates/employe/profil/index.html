<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="employe/header :: head">
    <title>Mon Profil</title>
</head>
<body>
<div th:replace="employe/menu :: sidebar"></div>

<main class="main-content">
    <div th:replace="employe/header :: employe-header" th:with="pageTitle='Mon Profil'"></div>

    <div class="container-fluid">

        <div class="alert alert-success" th:if="${param.success}">
            Profil mis à jour avec succès.
        </div>

        <div class="card">
            <div class="card-header">
                <strong>Informations personnelles</strong>
            </div>

            <div class="card-body">
                <form th:action="@{/employe/profil}" th:object="${form}" method="post">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-control" th:field="*{prenom}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" th:field="*{nom}" readonly>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email (non modifiable)</label>
                            <input type="email" class="form-control" th:value="${employe.email}" disabled>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Téléphone</label>
                            <input type="text" class="form-control" th:field="*{telephone}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('telephone')}"
                                 th:errors="*{telephone}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Adresse</label>
                            <textarea class="form-control" rows="3" th:field="*{adresse}"></textarea>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-save me-1"></i> Enregistrer
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/employe/dashboard}">
                            Annuler
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</main>
</body>
</html>
