<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Historique des Congés - RH</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <main class="main-content">
        <div th:replace="rh/layouts/header :: rh-header" th:with="pageTitle='Historique des Congés'"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <h1 class="h3" style="color: #3498db;"><i class="fas fa-history me-2"></i>Historique</h1>
            <a href="/rh/conges/en-attente" class="btn btn-primary"><i class="fas fa-clock me-2"></i>En Attente</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Congés traités</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Employé</th>
                                <th>Type</th>
                                <th>Dates</th>
                                <th>Durée</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="conge : ${conges}">
                                <td>
                                    <span class="fw-bold"
                                        th:text="${conge.employe.nom + ' ' + conge.employe.prenom}">Nom</span><br>
                                    <small class="text-muted"
                                        th:text="${conge.employe.departement?.nom ?: 'N/A'}">Dept</small>
                                </td>
                                <td><span class="badge bg-info" th:text="${conge.typeConge}">Type</span></td>
                                <td>
                                    <span th:text="${#temporals.format(conge.dateDebut, 'dd/MM/yyyy')}">01/01</span> -
                                    <span th:text="${#temporals.format(conge.dateFin, 'dd/MM/yyyy')}">05/01</span>
                                </td>
                                <td th:text="${conge.nombreJours} + ' jours'">5 jours</td>
                                <td>
                                    <span th:if="${conge.statut.name() == 'VALIDE_RH'}" class="badge bg-success">
                                        <i class="fas fa-check me-1"></i>Validé
                                    </span>
                                    <span th:if="${conge.statut.name() == 'REFUSE_RH'}" class="badge bg-danger">
                                        <i class="fas fa-times me-1"></i>Refusé
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/rh/conges/{id}(id=${conge.id})}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-eye"></i> Détails
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(conges)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-folder-open fa-3x mb-3"></i>
                                    <h5>Aucun historique</h5>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
