<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historique des Congés - RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #2980b9 0%, #3498db 100%);
        }

        .main-content {
            margin-left: 280px;
            padding: 20px;
            background: #f8f9fa;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div class="d-flex flex-column flex-shrink-0 p-3 text-white sidebar">
        <a href="/rh/dashboard" class="d-flex align-items-center mb-3 text-white text-decoration-none">
            <i class="fas fa-user-tie fa-2x me-2"></i><span class="fs-4 fw-bold">HR Manager</span>
        </a>
        <hr class="opacity-50">
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="/rh/dashboard" class="nav-link text-white"><i class="fas fa-tachometer-alt me-2"></i>Tableau de
                    bord</a></li>
            <li><a href="/rh/employes" class="nav-link text-white"><i class="fas fa-users me-2"></i>Employés</a></li>
            <li><a href="/rh/conges" class="nav-link text-white active bg-white bg-opacity-25"><i
                        class="fas fa-calendar-check me-2"></i>Congés</a></li>
            <li><a href="/rh/contrats" class="nav-link text-white"><i class="fas fa-file-contract me-2"></i>Contrats</a>
            </li>
            <li><a href="/rh/evaluations" class="nav-link text-white"><i
                        class="fas fa-chart-line me-2"></i>Évaluations</a></li>
            <li><a href="/rh/salaires" class="nav-link text-white"><i
                        class="fas fa-money-bill-wave me-2"></i>Salaires</a></li>
            <li><a href="/rh/statistiques" class="nav-link text-white"><i
                        class="fas fa-chart-pie me-2"></i>Statistiques</a></li>
        </ul>
    </div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3" style="color: #3498db;"><i class="fas fa-history me-2"></i>Historique des Congés</h1>
            <a href="/rh/conges/en-attente" class="btn btn-primary"><i class="fas fa-clock me-2"></i>En Attente</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Congés traités</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Employé</th>
                                <th>Type</th>
                                <th>Dates</th>
                                <th>Durée</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="conge : ${conges}">
                                <td>
                                    <span class="fw-bold"
                                        th:text="${conge.employe.nom + ' ' + conge.employe.prenom}">Nom</span><br>
                                    <small class="text-muted"
                                        th:text="${conge.employe.departement?.nom ?: 'N/A'}">Dept</small>
                                </td>
                                <td><span class="badge bg-info" th:text="${conge.typeConge}">Type</span></td>
                                <td>
                                    <span th:text="${#temporals.format(conge.dateDebut, 'dd/MM/yyyy')}">01/01</span> -
                                    <span th:text="${#temporals.format(conge.dateFin, 'dd/MM/yyyy')}">05/01</span>
                                </td>
                                <td th:text="${conge.nombreJours} + ' jours'">5 jours</td>
                                <td>
                                    <span th:if="${conge.statut.name() == 'VALIDE_RH'}" class="badge bg-success">
                                        <i class="fas fa-check me-1"></i>Validé
                                    </span>
                                    <span th:if="${conge.statut.name() == 'REFUSE_RH'}" class="badge bg-danger">
                                        <i class="fas fa-times me-1"></i>Refusé
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/rh/conges/{id}(id=${conge.id})}"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-eye"></i> Détails
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(conges)}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-folder-open fa-3x mb-3"></i>
                                    <h5>Aucun historique</h5>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
