<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Dashboard Congés - RH</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <style>
        .stat-card {
            border-radius: 15px;
            border: none;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3" style="color: #3498db;"><i class="fas fa-chart-bar me-2"></i>Dashboard des Congés</h1>
            <div>
                <a href="/rh/conges/en-attente" class="btn btn-primary"><i class="fas fa-clock me-2"></i>Validation</a>
                <a href="/rh/conges/historique" class="btn btn-outline-secondary"><i
                        class="fas fa-history me-2"></i>Historique</a>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-warning bg-opacity-25 me-3">
                            <i class="fas fa-hourglass-half fa-2x text-warning"></i>
                        </div>
                        <div>
                            <h3 class="mb-0" th:text="${stats.enAttente}">0</h3>
                            <small class="text-muted">En attente</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-success bg-opacity-25 me-3">
                            <i class="fas fa-check-circle fa-2x text-success"></i>
                        </div>
                        <div>
                            <h3 class="mb-0" th:text="${stats.approuvesMois}">0</h3>
                            <small class="text-muted">Approuvés ce mois</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-primary bg-opacity-25 me-3">
                            <i class="fas fa-percentage fa-2x text-primary"></i>
                        </div>
                        <div>
                            <h3 class="mb-0"><span
                                    th:text="${#numbers.formatDecimal(stats.tauxApprobation, 0, 1)}">0</span>%</h3>
                            <small class="text-muted">Taux d'approbation</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card shadow-sm">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-info bg-opacity-25 me-3">
                            <i class="fas fa-calendar-day fa-2x text-info"></i>
                        </div>
                        <div>
                            <h3 class="mb-0"><span
                                    th:text="${#numbers.formatDecimal(stats.moyenneDuree, 0, 1)}">0</span>j</h3>
                            <small class="text-muted">Durée moyenne</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <!-- Répartition par type -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-pie-chart me-2"></i>Répartition par Type</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="typeChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tendances mensuelles -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i>Tendances Mensuelles</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="tendanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Employees -->
        <div class="row">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-trophy me-2"></i>Top 5 Employés (jours de congé)</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Employé</th>
                                    <th>Jours</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="emp, iter : ${topEmployees}">
                                    <td><span class="badge bg-primary" th:text="${iter.index + 1}">1</span></td>
                                    <td th:text="${emp[1] + ' ' + emp[2]}">Nom</td>
                                    <td><span class="badge bg-info" th:text="${emp[3]} + ' j'">0 j</span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(topEmployees)}">
                                    <td colspan="3" class="text-center text-muted">Aucune donnée</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Récapitulatif annuel -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-calendar-alt me-2"></i>Récapitulatif Annuel</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-4">
                                <h2 class="text-success" th:text="${stats.approuvesAnnee}">0</h2>
                                <small class="text-muted">Approuvés</small>
                            </div>
                            <div class="col-4">
                                <h2 class="text-danger" th:text="${stats.refusesMois}">0</h2>
                                <small class="text-muted">Refusés</small>
                            </div>
                            <div class="col-4">
                                <h2 class="text-warning" th:text="${stats.enAttente}">0</h2>
                                <small class="text-muted">En attente</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // Type Chart (Pie)
        const typeCtx = document.getElementById('typeChart').getContext('2d');
        new Chart(typeCtx, {
            type: 'doughnut',
            data: {
                labels: ['Payé', 'Maladie', 'Maternité', 'Paternité', 'Sans solde'],
                datasets: [{
                    data: [
                        [[${ stats.congesPaye }]],
                        [[${ stats.congesMaladie }]],
                        [[${ stats.congesMaternite }]],
                        [[${ stats.congesPaternite }]],
                        [[${ stats.congesSansSolde }]]
                    ],
                    backgroundColor: ['#3498db', '#e74c3c', '#9b59b6', '#2ecc71', '#95a5a6']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Tendance Chart (Bar)
        const tendanceCtx = document.getElementById('tendanceChart').getContext('2d');
        const tendances = [[${ tendances }]];
        new Chart(tendanceCtx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Jun', 'Jul', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'],
                datasets: [{
                    label: 'Congés approuvés',
                    data: tendances.map(t => t[1]),
                    backgroundColor: '#3498db',
                    borderRadius: 5
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>

</html>
