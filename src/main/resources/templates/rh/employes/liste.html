<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Liste des Employés - RH</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3" style="color: #3498db;"><i class="fas fa-users me-2"></i>Liste des Employés</h1>
            <a href="/rh/employes/creer" class="btn btn-success">
                <i class="fas fa-plus me-2"></i>Nouveau Employé
            </a>
        </div>

        <!-- Filters -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/rh/employes}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Recherche</label>
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                            placeholder="Nom, prénom, email...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Département</label>
                        <select class="form-select" name="departementId">
                            <option value="">Tous</option>
                            <option th:each="dept : ${departements}" th:value="${dept.id}" th:text="${dept.nom}"
                                th:selected="${departementId == dept.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Rôle</label>
                        <select class="form-select" name="role">
                            <option value="">Tous</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${role == r}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-search me-2"></i>Filtrer</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Employees Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="fas fa-list me-2"></i>Employés (<span th:text="${totalItems}">0</span>)</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>
                                    <a th:href="@{/rh/employes(page=${currentPage}, keyword=${keyword}, departementId=${departementId}, role=${role}, sortField='nom', sortDir=${reverseSortDir})}"
                                        class="text-decoration-none text-dark">
                                        Nom & Prénom <i class="fas"
                                            th:classappend="${sortField == 'nom'} ? (${sortDir == 'asc'} ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'"></i>
                                    </a>
                                </th>
                                <th>Contact</th>
                                <th>Département</th>
                                <th>Poste</th>
                                <th>Rôle</th>
                                <th>Statut</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="employe : ${employesPage.content}">
                                <td>
                                    <span class="badge bg-secondary mb-1" th:text="${employe.matricule}">MAT</span><br>
                                    <span class="fw-bold" th:text="${employe.nom + ' ' + employe.prenom}">Nom
                                        Prénom</span><br>
                                    <small class="text-muted">
                                        <i class="far fa-calendar-alt me-1"></i>
                                        <span
                                            th:text="${#temporals.format(employe.dateEmbauche, 'dd/MM/yyyy')}">01/01/2024</span>
                                    </small>
                                </td>
                                <td>
                                    <small><i class="fas fa-envelope me-2 text-muted"></i><span
                                            th:text="${employe.email}">email@test.com</span></small><br>
                                    <small><i class="fas fa-phone me-2 text-muted"></i><span
                                            th:text="${employe.telephone}">0600000000</span></small>
                                </td>
                                <td>
                                    <span th:if="${employe.departement != null}" class="badge bg-info"
                                        th:text="${employe.departement.nom}">Dept</span>
                                    <span th:unless="${employe.departement != null}"
                                        class="badge bg-light text-dark">Non assigné</span>
                                </td>
                                <td><span class="badge bg-primary bg-opacity-75" th:text="${employe.poste}">Poste</span>
                                </td>
                                <td>
                                    <span th:switch="${employe.role.name()}">
                                        <span th:case="'SUPER_ADMIN'" class="badge bg-danger">SUPER ADMIN</span>
                                        <span th:case="'ADMIN'" class="badge bg-warning text-dark">ADMIN</span>
                                        <span th:case="'RH'" class="badge bg-success">RH</span>
                                        <span th:case="'MANAGER'" class="badge"
                                            style="background-color: #6f42c1;">MANAGER</span>
                                        <span th:case="'EMPLOYE'" class="badge bg-secondary">EMPLOYÉ</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${employe.isCompteActif}" class="badge bg-success"><i
                                            class="fas fa-check-circle me-1"></i>Actif</span>
                                    <span th:unless="${employe.isCompteActif}" class="badge bg-danger"><i
                                            class="fas fa-times-circle me-1"></i>Inactif</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{'/rh/employes/' + ${employe.id} + '/modifier'}"
                                            class="btn btn-sm btn-outline-primary" title="Modifier">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{'/rh/employes/' + ${employe.id} + '/supprimer'}"
                                            method="post" class="d-inline"
                                            onsubmit="return confirm('Êtes-vous sûr de vouloir supprimer cet employé ? Cette action est irréversible.')">
                                            <input type="hidden"
                                                th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                                                th:value="${_csrf != null ? _csrf.token : ''}" />
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                title="Supprimer">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${employesPage.empty}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="fas fa-search fa-3x mb-3"></i>
                                    <h5>Aucun résultat trouvé</h5>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/rh/employes(page=0, keyword=${keyword}, departementId=${departementId}, role=${role}, sortField=${sortField}, sortDir=${sortDir})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
                            th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link"
                                th:href="@{/rh/employes(page=${i}, keyword=${keyword}, departementId=${departementId}, role=${role}, sortField=${sortField}, sortDir=${sortDir})}"
                                th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                                th:href="@{/rh/employes(page=${totalPages - 1}, keyword=${keyword}, departementId=${departementId}, role=${role}, sortField=${sortField}, sortDir=${sortDir})}">&raquo;</a>
                        </li>
                    </ul>
                    <div class="text-center text-muted small">Page <span th:text="${currentPage + 1}">1</span> sur <span
                            th:text="${totalPages}">1</span></div>
                </nav>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
