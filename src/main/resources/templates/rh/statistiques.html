<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Statistiques RH</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <main class="main-content">
        <h1 class="h3 mb-4" style="color: #3498db;"><i class="fas fa-chart-pie me-2"></i>Statistiques RH</h1>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm text-white bg-primary">
                    <div class="card-body">
                        <h6>Total Employés</h6>
                        <h2 th:text="${totalEmployes ?: 0}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm text-white bg-success">
                    <div class="card-body">
                        <h6>Employés Actifs</h6>
                        <h2 th:text="${employesActifs ?: 0}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm text-white bg-warning">
                    <div class="card-body">
                        <h6>Départements</h6>
                        <h2 th:text="${totalDepartements ?: 0}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm text-white bg-danger">
                    <div class="card-body">
                        <h6>Inactifs</h6>
                        <h2 th:text="${employesInactifs ?: 0}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Chart: Employees by Role -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Répartition par Rôle</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="roleChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Chart: Departments -->
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Employés par Département</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="deptChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Department Table -->
        <div class="card border-0 shadow-sm mt-4">
            <div class="card-header bg-white">
                <h5 class="mb-0">Détail par Département</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Département</th>
                            <th>Manager</th>
                            <th>Nb Employés</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dept : ${departements}">
                            <td th:text="${dept.nom}">Dept</td>
                            <td th:text="${dept.manager != null ? dept.manager.nom : 'Non assigné'}">Manager</td>
                            <td th:text="${dept.employes != null ? dept.employes.size() : 0}">0</td>
                            <td>
                                <span th:if="${dept.isActif}" class="badge bg-success">Actif</span>
                                <span th:unless="${dept.isActif}" class="badge bg-secondary">Inactif</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        // Role Chart
        const roleStats = /*[[${statistiquesParRole}]]*/ {};
        const roleLabels = Object.keys(roleStats);
        const roleData = Object.values(roleStats);

        new Chart(document.getElementById('roleChart'), {
            type: 'doughnut',
            data: {
                labels: roleLabels,
                datasets: [{
                    data: roleData,
                    backgroundColor: ['#e74c3c', '#f39c12', '#27ae60', '#9b59b6', '#95a5a6']
                }]
            }
        });

        // Department Chart
        const depts = /*[[${departements}]]*/[];
        const deptLabels = depts.map(d => d.nom);
        const deptData = depts.map(d => d.employes ? d.employes.length : 0);

        new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: {
                labels: deptLabels,
                datasets: [{
                    label: 'Employés',
                    data: deptData,
                    backgroundColor: '#3498db'
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>

</html>
