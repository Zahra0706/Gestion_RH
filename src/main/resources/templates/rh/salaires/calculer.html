<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Calculer Salaire</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <main class="main-content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Nouveau Calcul de Salaire</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/rh/salaires}" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Retour
                </a>
            </div>
        </div>

        <!-- Alertes -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Sélectionner un employé</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/rh/salaires/calculer-auto}" method="post">
                            <div class="mb-3">
                                <label for="employeId" class="form-label">Employé</label>
                                <select id="employeId" class="form-select" required>
                                    <option value="" selected disabled>Choisir un employé...</option>
                                    <option th:each="employe : ${employes}" th:value="${employe.id}"
                                        th:text="${employe.nom + ' ' + employe.prenom + ' (' + employe.matricule + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Période</label>
                                <div class="row g-2">
                                    <div class="col-7">
                                        <select id="selectMois" class="form-select" required>
                                            <option value="" disabled selected>Mois...</option>
                                            <option value="01">Janvier</option>
                                            <option value="02">Février</option>
                                            <option value="03">Mars</option>
                                            <option value="04">Avril</option>
                                            <option value="05">Mai</option>
                                            <option value="06">Juin</option>
                                            <option value="07">Juillet</option>
                                            <option value="08">Août</option>
                                            <option value="09">Septembre</option>
                                            <option value="10">Octobre</option>
                                            <option value="11">Novembre</option>
                                            <option value="12">Décembre</option>
                                        </select>
                                    </div>
                                    <div class="col-5">
                                        <select id="selectAnnee" class="form-select" required>
                                            <option
                                                th:each="i : ${#numbers.sequence(#dates.year(#dates.createNow()) - 1, #dates.year(#dates.createNow()) + 1)}"
                                                th:value="${i}" th:text="${i}"
                                                th:selected="${i == #dates.year(#dates.createNow())}"></option>
                                        </select>
                                    </div>
                                </div>
                                <input type="hidden" id="mois" name="mois">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" onclick="goToCalcul()" class="btn btn-primary">
                                    <i class="fas fa-calculator me-2"></i>Commencer le calcul
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        function goToCalcul() {
            var empId = document.getElementById('employeId').value;

            var moisVal = document.getElementById('selectMois').value;
            var anneeVal = document.getElementById('selectAnnee').value;

            if (empId && moisVal && anneeVal) {
                var mois = anneeVal + '-' + moisVal;
                window.location.href = '/rh/salaires/calculer/' + empId + '?mois=' + mois;
            } else {
                alert('Veuillez sélectionner un employé et une période valide.');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
