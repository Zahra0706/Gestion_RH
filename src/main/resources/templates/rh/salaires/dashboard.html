<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="~{rh/layouts/header :: head}">
    <title>Dashboard Salaires</title>
</head>

<body>
    <div th:replace="~{rh/layouts/menu :: sidebar}"></div>

    <main class="main-content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Tableau de bord Salaires</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/rh/salaires}" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-list me-2"></i>Liste Salaires
                </a>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-start border-4 border-primary">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <p class="text-muted mb-0">Masse Salariale (Mois)</p>
                                <h3 class="fw-bold mb-0"
                                    th:text="${#numbers.formatDecimal(stats.totalMasseSalariale, 1, 2) + ' Dhs'}">0.00
                                </h3>
                            </div>
                            <div class="rounded-circle bg-primary bg-opacity-10 p-3 text-primary">
                                <i class="fas fa-coins fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-start border-4 border-success">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <p class="text-muted mb-0">Salaire Moyen</p>
                                <h3 class="fw-bold mb-0"
                                    th:text="${#numbers.formatDecimal(stats.moyenneSalaire, 1, 2) + ' Dhs'}">0.00</h3>
                            </div>
                            <div class="rounded-circle bg-success bg-opacity-10 p-3 text-success">
                                <i class="fas fa-chart-line fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-start border-4 border-warning">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <p class="text-muted mb-0">En Attente Validation</p>
                                <h3 class="fw-bold mb-0" th:text="${stats.enAttente}">0</h3>
                            </div>
                            <div class="rounded-circle bg-warning bg-opacity-10 p-3 text-warning">
                                <i class="fas fa-clock fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0"><i class="fas fa-chart-bar me-2 text-primary"></i>Évolution de la Masse
                    Salariale (6 derniers mois)</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Mois</th>
                                <th>Masse Salariale</th>
                                <th>Évolution</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry, iterStat : ${evolution}">
                                <td th:text="${entry.key}">YYYY-MM</td>
                                <td th:text="${#numbers.formatDecimal(entry.value, 1, 2) + ' Dhs'}" class="fw-bold">
                                </td>
                                <td>
                                    <!-- Simple logic for visual only, real calc would need comparison -->
                                    <span class="badge bg-light text-dark">
                                        <i class="fas fa-minus"></i>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
