<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #2980b9 0%, #3498db 100%);
        }

        .main-content {
            margin-left: 280px;
            padding: 20px;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .stat-card {
            border-left: 4px solid;
        }

        .stat-card.blue {
            border-color: #3498db;
        }

        .stat-card.green {
            border-color: #27ae60;
        }

        .stat-card.orange {
            border-color: #f39c12;
        }

        .stat-card.red {
            border-color: #e74c3c;
        }
    </style>
</head>

<body>
    <div class="d-flex flex-column flex-shrink-0 p-3 text-white sidebar">
        <a href="/rh/dashboard" class="d-flex align-items-center mb-3 text-white text-decoration-none">
            <i class="fas fa-user-tie fa-2x me-2"></i><span class="fs-4 fw-bold">HR Manager</span>
        </a>
        <hr class="opacity-50">
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="/rh/dashboard" class="nav-link text-white active bg-white bg-opacity-25"><i
                        class="fas fa-tachometer-alt me-2"></i>Tableau de bord</a></li>
            <li><a href="/rh/employes" class="nav-link text-white"><i class="fas fa-users me-2"></i>Employés</a></li>
            <li><a href="/rh/conges" class="nav-link text-white"><i class="fas fa-calendar-check me-2"></i>Congés</a>
            </li>
            <li><a href="/rh/contrats" class="nav-link text-white"><i class="fas fa-file-contract me-2"></i>Contrats</a>
            </li>
            <li><a href="/rh/evaluations" class="nav-link text-white"><i
                        class="fas fa-chart-line me-2"></i>Évaluations</a></li>
            <li><a href="/rh/salaires" class="nav-link text-white"><i
                        class="fas fa-money-bill-wave me-2"></i>Salaires</a></li>
            <li><a href="/rh/statistiques" class="nav-link text-white"><i
                        class="fas fa-chart-pie me-2"></i>Statistiques</a></li>
        </ul>
    </div>

    <main class="main-content">
        <h1 class="h3 mb-4" style="color: #3498db;"><i class="fas fa-tachometer-alt me-2"></i>Tableau de Bord RH</h1>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card blue">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Total Employés</h6>
                                <h3 class="mb-0" th:text="${totalEmployes ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-users fa-2x text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card green">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Employés Actifs</h6>
                                <h3 class="mb-0" th:text="${employesActifs ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-user-check fa-2x text-success opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card orange">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Départements</h6>
                                <h3 class="mb-0" th:text="${totalDepartements ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-building fa-2x text-warning opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card red">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Employés Inactifs</h6>
                                <h3 class="mb-0" th:text="${employesInactifs ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-user-times fa-2x text-danger opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Departments Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-building me-2"></i>Départements</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nom</th>
                                <th>Code</th>
                                <th>Manager</th>
                                <th>Employés</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dept : ${departements}">
                                <td th:text="${dept.nom}">Département</td>
                                <td><span class="badge bg-secondary" th:text="${dept.code}">CODE</span></td>
                                <td
                                    th:text="${dept.manager != null ? dept.manager.nom + ' ' + dept.manager.prenom : 'Non assigné'}">
                                    Manager</td>
                                <td th:text="${dept.employes != null ? dept.employes.size() : 0}">0</td>
                                <td>
                                    <span th:if="${dept.isActif}" class="badge bg-success">Actif</span>
                                    <span th:unless="${dept.isActif}" class="badge bg-danger">Inactif</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
