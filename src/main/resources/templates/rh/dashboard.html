<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="~{rh/layouts/header :: head}">
    <title>Dashboard RH</title>
</head>

<body>
    <div th:replace="~{rh/layouts/menu :: sidebar}"></div>

    <main class="main-content">
        <h1 class="h3 mb-4" style="color: #3498db;"><i class="fas fa-tachometer-alt me-2"></i>Tableau de Bord RH</h1>

        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card blue">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Total Employés</h6>
                                <h3 class="mb-0" th:text="${totalEmployes ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-users fa-2x text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card green">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Employés Actifs</h6>
                                <h3 class="mb-0" th:text="${employesActifs ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-user-check fa-2x text-success opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card orange">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Départements</h6>
                                <h3 class="mb-0" th:text="${totalDepartements ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-building fa-2x text-warning opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm stat-card red">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted mb-1">Employés Inactifs</h6>
                                <h3 class="mb-0" th:text="${employesInactifs ?: 0}">0</h3>
                            </div>
                            <i class="fas fa-user-times fa-2x text-danger opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Departments Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fas fa-building me-2"></i>Départements</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Nom</th>
                                <th>Code</th>
                                <th>Manager</th>
                                <th>Employés</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dept : ${departements}">
                                <td th:text="${dept.nom}">Département</td>
                                <td><span class="badge bg-secondary" th:text="${dept.code}">CODE</span></td>
                                <td
                                    th:text="${dept.manager != null ? dept.manager.nom + ' ' + dept.manager.prenom : 'Non assigné'}">
                                    Manager</td>
                                <td th:text="${dept.employes != null ? dept.employes.size() : 0}">0</td>
                                <td>
                                    <span th:if="${dept.isActif}" class="badge bg-success">Actif</span>
                                    <span th:unless="${dept.isActif}" class="badge bg-danger">Inactif</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
