<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Détails Contrat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Détails du Contrat #<span th:text="${contrat.id}">1</span></h4>
                <span class="badge bg-white text-primary" th:text="${contrat.statut}">ACTIF</span>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <h5 class="text-muted mb-3">Employé</h5>
                        <p class="fs-5 fw-bold" th:text="${contrat.employe.nom + ' ' + contrat.employe.prenom}">Nom</p>
                        <p>Matricule: <span th:text="${contrat.employe.matricule}">123</span></p>
                    </div>
                </div>

                <hr>

                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="text-muted small">Type de Contrat</label>
                        <p class="fs-5" th:text="${contrat.typeContrat}">CDI</p>
                    </div>
                    <div class="col-md-4">
                        <label class="text-muted small">Date Début</label>
                        <p class="fs-5" th:text="${#temporals.format(contrat.dateDebut, 'dd/MM/yyyy')}">01/01/2024</p>
                    </div>
                    <div class="col-md-4">
                        <label class="text-muted small">Date Fin</label>
                        <p class="fs-5"
                            th:text="${contrat.dateFin != null ? #temporals.format(contrat.dateFin, 'dd/MM/yyyy') : 'Indéterminée'}">
                            -</p>
                    </div>

                    <div class="col-md-4">
                        <label class="text-muted small">Salaire Base</label>
                        <p class="fs-5 fw-bold text-success" th:text="${contrat.salaireBase} + ' MAD'">10000 MAD</p>
                    </div>
                    <div class="col-md-4">
                        <label class="text-muted small">Volume Horaire</label>
                        <p class="fs-5" th:text="${contrat.heuresHebdomadaires} + ' h/semaine'">44</p>
                    </div>
                    <div class="col-md-4">
                        <label class="text-muted small">Période d'essai</label>
                        <p class="fs-5"
                            th:text="${contrat.periodeEssaiMois != null ? contrat.periodeEssaiMois + ' mois' : '-'}">-
                        </p>
                    </div>
                </div>

                <div class="mt-4 p-3 bg-light rounded" th:if="${contrat.avantages}">
                    <h6 class="text-muted"><i class="fas fa-gift me-2"></i>Avantages</h6>
                    <p class="mb-0" th:text="${contrat.avantages}">Voiture</p>
                </div>

                <div class="mt-4 alert alert-info" th:if="${contrat.referenceContrat}">
                    <i class="fas fa-barcode me-2"></i>Référence Officielle: <strong
                        th:text="${contrat.referenceContrat}">REF-2024-0001</strong>
                </div>

                <div class="mt-4 alert alert-warning" th:if="${contrat.dateEnvoiSignature}">
                    <i class="fas fa-paper-plane me-2"></i>Envoyé pour signature le <strong
                        th:text="${contrat.dateEnvoiSignature}">01/01/2024</strong>
                </div>

                <div class="mt-4 text-end">
                    <a href="/rh/contrats" class="btn btn-secondary me-2">Retour</a>

                    <form th:if="${contrat.referenceContrat == null}"
                        th:action="@{/rh/contrats/{id}/valider(id=${contrat.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-info text-white me-2">
                            <i class="fas fa-check-circle me-2"></i>Valider
                        </button>
                    </form>

                    <form th:if="${contrat.referenceContrat != null and contrat.dateEnvoiSignature == null}"
                        th:action="@{/rh/contrats/{id}/envoyer(id=${contrat.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-warning me-2">
                            <i class="fas fa-paper-plane me-2"></i>Envoyer à l'employé
                        </button>
                    </form>

                    <button class="btn btn-primary"><i class="fas fa-print me-2"></i>Imprimer</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
