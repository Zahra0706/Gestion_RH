<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head th:replace="rh/layouts/header :: head">
    <title>Détails Contrat</title>
</head>

<body>
    <div th:replace="rh/layouts/menu :: sidebar"></div>

    <main class="main-content">
        <div class="container py-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Détails du Contrat #<span th:text="${contrat.id}">1</span></h4>
                    <span class="badge bg-white text-primary" th:text="${contrat.statut}">ACTIF</span>
                </div>
                <div class="card-body">
                    <!-- Alerts -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <h5 class="text-muted mb-3">Employé</h5>
                            <div th:if="${contrat.employe != null}">
                                <p class="fs-5 fw-bold" th:text="${contrat.employe.nom + ' ' + contrat.employe.prenom}">
                                    Nom</p>
                                <p>Matricule: <span th:text="${contrat.employe.matricule}">123</span></p>
                            </div>
                            <div th:if="${contrat.employe == null}" class="alert alert-danger">Employé non assigné</div>
                        </div>
                    </div>

                    <hr>

                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="text-muted small">Type de Contrat</label>
                            <p class="fs-5" th:text="${contrat.typeContrat}">CDI</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted small">Date Début</label>
                            <p class="fs-5" th:if="${contrat.dateDebut != null}"
                                th:text="${#temporals.format(contrat.dateDebut, 'dd/MM/yyyy')}">01/01/2024</p>
                            <p class="fs-5 text-danger" th:if="${contrat.dateDebut == null}">Non définie</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted small">Date Fin</label>
                            <p class="fs-5"
                                th:text="${contrat.dateFin != null ? #temporals.format(contrat.dateFin, 'dd/MM/yyyy') : 'Indéterminée'}">
                                -</p>
                        </div>

                        <div class="col-md-4">
                            <label class="text-muted small">Salaire Base</label>
                            <p class="fs-5 fw-bold text-success"
                                th:text="${contrat.salaireBase != null ? contrat.salaireBase + ' MAD' : '-'}">10000 MAD
                            </p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted small">Volume Horaire</label>
                            <p class="fs-5"
                                th:text="${contrat.heuresHebdomadaires != null ? contrat.heuresHebdomadaires + ' h/semaine' : '-'}">
                                44</p>
                        </div>
                        <div class="col-md-4">
                            <label class="text-muted small">Période d'essai</label>
                            <p class="fs-5"
                                th:text="${contrat.dureeEssai != null ? contrat.dureeEssai + ' jours' : '-'}">
                                -
                            </p>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-light rounded" th:if="${contrat.avantages}">
                        <h6 class="text-muted"><i class="fas fa-gift me-2"></i>Avantages</h6>
                        <p class="mb-0" th:text="${contrat.avantages}">Voiture</p>
                    </div>

                    <div class="mt-4 alert alert-info" th:if="${contrat.referenceContrat}">
                        <i class="fas fa-barcode me-2"></i>Référence Officielle: <strong
                            th:text="${contrat.referenceContrat}">REF-2024-0001</strong>
                    </div>

                    <div class="mt-4 text-end">
                        <a href="/rh/contrats" class="btn btn-secondary me-2">
                            <i class="fas fa-arrow-left me-2"></i>Retour
                        </a>

                        <!-- Bouton Modifier les Données -->
                        <a th:href="@{/rh/contrats/{id}/modifier(id=${contrat.id})}" class="btn btn-primary me-2"
                            title="Modifier les informations du contrat (salaire, dates, poste...)">
                            <i class="fas fa-edit me-2"></i>Modifier les Données
                        </a>

                        <!-- Bouton Éditer le Contenu HTML (pour utilisateurs avancés) -->
                        <a th:href="@{/rh/contrats/{id}/editer(id=${contrat.id})}"
                            class="btn btn-outline-secondary me-2"
                            title="Éditer le contenu HTML du contrat (mode avancé)">
                            <i class="fas fa-code me-2"></i>Éditer HTML
                        </a>

                        <form th:if="${contrat.statut.name() == 'BROUILLON'}"
                            th:action="@{/rh/contrats/{id}/valider(id=${contrat.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-info text-white me-2">
                                <i class="fas fa-check-circle me-2"></i>Valider
                            </button>
                        </form>

                        <form th:if="${contrat.statut.name() == 'EN_ATTENTE_SIGNATURE'}"
                            th:action="@{/rh/contrats/{id}/signer(id=${contrat.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-success me-2">
                                <i class="fas fa-file-signature me-2"></i>Signer (Activer)
                            </button>
                        </form>

                        <form th:action="@{/rh/contrats/{id}/envoyer(id=${contrat.id})}" method="post" class="d-inline"
                            th:if="${contrat.statut.name() != 'BROUILLON'}">
                            <button type="submit" class="btn btn-warning me-2">
                                <i class="fas fa-paper-plane me-2"></i>Renvoyer Email
                            </button>
                        </form>

                        <a th:href="@{/rh/contrats/{id}/pdf(id=${contrat.id})}" class="btn btn-success" target="_blank">
                            <i class="fas fa-print me-2"></i>Télécharger PDF
                        </a>
                    </div>

                </div>
            </div>
        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
