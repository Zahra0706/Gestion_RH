<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/menu-rh}">

<head>
    <title>Modèles de Contrats</title>
</head>

<body>
    <div layout:fragment="content" class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-file-contract me-2"></i>Modèles de Contrats</h2>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col" th:each="template : ${templates}">
                <div class="card h-100 shadow-sm hover-shadow">
                    <div class="card-body text-center">
                        <div class="mb-3 text-primary">
                            <i class="fas fa-file-alt fa-3x"></i>
                        </div>
                        <h5 class="card-title" th:text="${template.nom}">Nom du Modèle</h5>
                        <p class="text-muted small" th:text="${template.typeContrat}">Type</p>
                        <p class="card-text text-truncate" th:text="${template.description}">Description...</p>
                    </div>
                    <div class="card-footer bg-white border-top-0 text-center pb-3">
                        <a th:href="@{/rh/contrats/templates/generer/{id}(id=${template.id})}"
                            class="btn btn-outline-primary w-100">
                            <i class="fas fa-edit me-2"></i>Utiliser ce modèle
                        </a>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(templates)}">
                <p class="text-muted">Aucun modèle disponible.</p>
            </div>
        </div>
    </div>
</body>

</html>
