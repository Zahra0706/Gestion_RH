<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestion des Contrats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            background: linear-gradient(180deg, #2980b9 0%, #3498db 100%);
        }

        .main-content {
            margin-left: 280px;
            padding: 20px;
            background: #f8f9fa;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <!-- Sidebar (Simplified copy from liste.html to maintain consistency) -->
    <div class="d-flex flex-column flex-shrink-0 p-3 text-white sidebar">
        <a href="/rh/dashboard" class="d-flex align-items-center mb-3 text-white text-decoration-none">
            <i class="fas fa-user-tie fa-2x me-2"></i><span class="fs-4 fw-bold">HR Manager</span>
        </a>
        <hr class="opacity-50">
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="/rh/dashboard" class="nav-link text-white"><i class="fas fa-tachometer-alt me-2"></i>Tableau de
                    bord</a></li>
            <li><a href="/rh/employes" class="nav-link text-white"><i class="fas fa-users me-2"></i>Employés</a></li>
            <li><a href="/rh/conges" class="nav-link text-white"><i class="fas fa-calendar-check me-2"></i>Congés</a>
            </li>
            <li><a href="/rh/contrats" class="nav-link text-white active bg-white bg-opacity-25"><i
                        class="fas fa-file-contract me-2"></i>Contrats</a></li>
            <li><a href="/rh/evaluations" class="nav-link text-white"><i
                        class="fas fa-chart-line me-2"></i>Évaluations</a></li>
            <li><a href="/rh/salaires" class="nav-link text-white"><i
                        class="fas fa-money-bill-wave me-2"></i>Salaires</a></li>
            <li><a href="/rh/statistiques" class="nav-link text-white"><i
                        class="fas fa-chart-pie me-2"></i>Statistiques</a></li>
        </ul>
    </div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 text-primary"><i class="fas fa-file-contract me-2"></i>Contrats de Travail</h1>
            <a href="/rh/contrats/nouveau" class="btn btn-success"><i class="fas fa-plus me-2"></i>Nouveau Contrat</a>
        </div>

        <!-- Stats Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3" th:each="stat : ${stats}">
                <div class="card border-0 shadow-sm">
                    <div class="card-body text-center">
                        <h4 class="mb-0 text-primary" th:text="${stat.value}">0</h4>
                        <small class="text-muted" th:text="${stat.key}">Type</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contracts List -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Employé</th>
                            <th>Type</th>
                            <th>Date Début</th>
                            <th>Fin</th>
                            <th>Salaire (MAD)</th>
                            <th>Statut</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="contrat : ${contrats}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                                        style="width: 35px; height: 35px;">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold"
                                            th:text="${contrat.employe.nom + ' ' + contrat.employe.prenom}">Nom</div>
                                        <small class="text-muted"
                                            th:text="${contrat.employe.departement?.nom}">Dept</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge bg-info" th:text="${contrat.typeContrat}">CDI</span></td>
                            <td th:text="${#temporals.format(contrat.dateDebut, 'dd/MM/yyyy')}">01/01/2024</td>
                            <td
                                th:text="${contrat.dateFin != null ? #temporals.format(contrat.dateFin, 'dd/MM/yyyy') : '-'}">
                                -</td>
                            <td th:text="${contrat.salaireBase}">10000</td>
                            <td><span class="badge bg-success" th:text="${contrat.statut}">ACTIF</span></td>
                            <td class="text-end">
                                <a th:href="@{/rh/contrats/{id}(id=${contrat.id})}"
                                    class="btn btn-sm btn-outline-primary"><i class="fas fa-eye"></i></a>
                                <form th:action="@{/rh/contrats/{id}/archiver(id=${contrat.id})}" method="post"
                                    class="d-inline" onsubmit="return confirm('Archiver ce contrat ?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i
                                            class="fas fa-archive"></i></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
