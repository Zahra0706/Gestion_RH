<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HR Manager - Espace RH</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>

<body>
    <!-- Header Fragment -->
    <div th:fragment="rh-header">
        <div class="admin-header">
            <div class="header-left">
                <button class="btn btn-outline-secondary d-md-none menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h4 class="mb-0" th:text="${pageTitle ?: 'Tableau de Bord RH'}"></h4>
                <small class="text-muted">Ressources Humaines</small>
            </div>

            <div class="user-info">
                <div th:if="${user != null}" class="user-avatar"
                    th:text="${#strings.substring(user.nom, 0, 1) + #strings.substring(user.prenom, 0, 1)}">
                    RH
                </div>
                <div th:if="${user != null}">
                    <div class="fw-bold" th:text="${user.prenom + ' ' + user.nom}"></div>
                    <small class="text-muted" th:text="${user.role}">RH</small>
                </div>
                <div th:if="${user == null}" class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div th:if="${user == null}">
                    <div class="fw-bold" sec:authentication="name"></div>
                    <small class="text-muted">Utilisateur</small>
                </div>
                <div class="dropdown">
                    <button class="btn btn-link text-dark" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${user != null}">
                            <a class="dropdown-item" th:href="@{/rh/profil}">
                                <i class="fas fa-user me-2"></i>Mon Profil
                            </a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
