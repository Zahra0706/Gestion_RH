<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="layouts/header :: head">
    <title>Remplir évaluation - Manager</title>
</head>

<body>
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">

    <div th:replace="layouts/header :: admin-header"></div>

    <div class="page-header mb-4">
        <h2><i class="fas fa-edit me-2"></i>Remplir une évaluation</h2>
        <p class="text-muted" th:if="${evaluation != null && evaluation.employe != null && evaluation.employe.departement != null}">
            Département : <b th:text="${evaluation.employe.departement.nom}"></b>
        </p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="chart-card">
        <h6 class="chart-title">Formulaire</h6>

        <form th:action="@{/manager/evaluations/{id}/remplir(id=${evaluation.id})}" method="post">



            <!-- CSRF -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Infos -->
            <div class="col-md-6">
                <label class="form-label">Employé</label>
                <input type="text" class="form-control"
                       th:value="${evaluation.employe.prenom + ' ' + evaluation.employe.nom}"
                       disabled>
            </div>

            <div class="col-md-6">
                <label class="form-label">Année</label>
                <input type="text" class="form-control"
                       th:value="${evaluation.annee}"
                       disabled>
            </div>

            <!-- Scores -->
            <div class="col-md-6">
                <label class="form-label">Score Performance (0 - 20)</label>
                <input type="number" name="scorePerformance"
                       class="form-control"
                       step="0.1" min="0" max="20"
                       th:value="${evaluation.scorePerformance}"
                       required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Score Compétences (0 - 20)</label>
                <input type="number" name="scoreCompetences"
                       class="form-control"
                       step="0.1" min="0" max="20"
                       th:value="${evaluation.scoreCompetences}"
                       required>
            </div>

            <div class="col-12">
                <label class="form-label">Commentaires manager</label>
                <textarea name="commentairesManager" class="form-control" rows="5"
                          th:text="${evaluation.commentairesManager}"></textarea>
            </div>

            <!-- Actions -->
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Enregistrer
                </button>

                <a th:href="@{/manager/evaluations}" class="btn btn-secondary">
                    Annuler
                </a>
            </div>

        </form>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>
</body>
</html>
