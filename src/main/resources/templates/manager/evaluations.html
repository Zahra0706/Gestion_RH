<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="layouts/header :: head">
    <title>Évaluations - Manager</title>
</head>

<body>
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">

    <div th:replace="layouts/header :: admin-header"></div>

    <div class="page-header mb-4">
        <h2><i class="fas fa-chart-bar me-2"></i>Évaluations</h2>
        <p class="text-muted" th:if="${departement != null}">
            Département : <b th:text="${departement.nom}"></b>
        </p>
    </div>

    <!-- Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="chart-card">
        <h6 class="chart-title">Liste des évaluations</h6>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Employé</th>
                    <th>Année</th>
                    <th>Statut</th>
                    <th>Score global</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="e : ${evaluations}">
                    <td class="fw-bold" th:text="${e.employe.prenom + ' ' + e.employe.nom}">Employé</td>

                    <td th:text="${e.annee}">2025</td>

                    <td>
                       <span class="badge"
                             th:classappend="${e.statut != null and e.statut.name() == 'COMPLETEE'} ? ' bg-success' :
                      (${e.statut != null and e.statut.name() == 'EN_COURS'} ? ' bg-warning text-dark' :
                      (${e.statut != null and e.statut.name() == 'ARCHIVEE'} ? ' bg-secondary' :
                      ' bg-info'))"
                             th:text="${e.statut}">
</span>

                    </td>

                    <td th:text="${e.scoreGlobal != null ? #numbers.formatDecimal(e.scoreGlobal, 1, 2) : '-'}">-</td>

                    <td class="text-end">
                        <div class="d-flex flex-column align-items-end gap-2">

                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/manager/evaluations/{id}/remplir(id=${e.id})}">
                                <i class="fas fa-pen"></i> Remplir
                            </a>

                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(evaluations)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Aucune évaluation trouvée
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>
</body>
</html>
