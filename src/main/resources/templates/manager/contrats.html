<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="layouts/header :: head">
    <title>Contrats - Manager</title>
</head>

<body>
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">
    <div th:replace="layouts/header :: admin-header"></div>

    <div class="page-header mb-4">
        <h2><i class="fas fa-file-contract me-2"></i>Contrats</h2>
        <p class="text-muted" th:if="${departement != null}">
            Département : <b th:text="${departement.nom}"></b>
        </p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="chart-card">
        <h6 class="chart-title">Contrats des employés du département</h6>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Employé</th>
                    <th>Type contrat</th>
                    <th>Date début</th>
                    <th>Date fin</th>
                    <th>Salaire base</th>
                    <th>Heures / semaine</th>
                </tr>
                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(contrats)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Aucun contrat trouvé
                    </td>
                </tr>

                <tr th:each="c : ${contrats}">
                    <td th:text="${c.employe.prenom + ' ' + c.employe.nom}"></td>

                    <td th:text="${c.typeContrat}"></td>

                    <td th:text="${c.dateDebut != null ? #temporals.format(c.dateDebut,'dd/MM/yyyy') : '-'}"></td>

                    <td th:text="${c.dateFin != null ? #temporals.format(c.dateFin,'dd/MM/yyyy') : '-'}"></td>

                    <td th:text="${c.salaireBase != null ? c.salaireBase : '-'}"></td>

                    <td th:text="${c.heuresHebdomadaires != null ? c.heuresHebdomadaires : '-'}"></td>
                </tr>

                </tbody>
            </table>
        </div>

        <small class="text-muted d-block mt-2">

        </small>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>
</body>
</html>
