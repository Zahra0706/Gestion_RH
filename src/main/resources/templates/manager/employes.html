<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="layouts/header :: head">
    <title>Employés - Manager</title>
</head>

<body>
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">

    <div th:replace="layouts/header :: admin-header"></div>

    <div class="page-header mb-4">
        <h2><i class="fas fa-users me-2"></i>Employés de département</h2>
        <p class="text-muted" th:if="${departement != null}">
            Département : <b th:text="${departement.nom}"></b>
        </p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="chart-card">
        <h6 class="chart-title">Liste des employés</h6>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Employé</th>
                    <th>Email</th>
                    <th>Poste</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="e : ${employees}">
                    <td th:text="${e.prenom + ' ' + e.nom}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.poste}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${e.isCompteActif} ? ' bg-success' : ' bg-secondary'"
                              th:text="${e.isCompteActif} ? 'Actif' : 'Inactif'"></span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        Aucun employé trouvé
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>
</body>
</html>
