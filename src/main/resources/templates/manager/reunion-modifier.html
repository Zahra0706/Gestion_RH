<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="fr">

<head th:replace="layouts/header :: head">
    <title>Modifier Réunion - Manager</title>
</head>

<body>
<!-- Sidebar -->
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">

    <!-- Header -->
    <div th:replace="layouts/header :: admin-header"></div>

    <!-- Title -->
    <div class="page-header mb-4">
        <h2><i class="fas fa-edit me-2"></i>Modifier la réunion</h2>
        <p class="text-muted">Mettez à jour les informations de la réunion</p>
    </div>

    <!-- Messages -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="chart-card">
        <h6 class="chart-title mb-3">
            <i class="fas fa-calendar"></i> Informations réunion
        </h6>

        <form th:action="@{'/manager/reunions/' + ${reunion.id} + '/modifier'}"
              method="post" class="row g-3">

            <!-- ✅ CSRF (important si Spring Security est activé) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="col-md-6">
                <label class="form-label">Titre</label>
                <input type="text" name="titre" class="form-control" required
                       th:value="${reunion.titre}">
            </div>

            <div class="col-md-6">
                <label class="form-label">Lieu</label>
                <input type="text" name="lieu" class="form-control"
                       th:value="${reunion.lieu}">
            </div>

            <div class="col-md-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3"
                          th:text="${reunion.description}"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date/Heure début</label>
                <input type="datetime-local" name="dateHeureDebut" class="form-control" required
                       th:value="${reunion.dateHeureDebut != null ? #temporals.format(reunion.dateHeureDebut, 'yyyy-MM-dd''T''HH:mm') : ''}">

            </div>

            <div class="col-md-6">
                <label class="form-label">Date/Heure fin</label>
                <input type="datetime-local" name="dateHeureFin" class="form-control" required
                       th:value="${reunion.dateHeureFin != null ? #temporals.format(reunion.dateHeureFin, 'yyyy-MM-dd''T''HH:mm') : ''}">

            </div>

            <!-- Participants (optionnel) -->
            <div class="col-md-12">
                <label class="form-label">Participants</label>
                <select name="participantIds" class="form-select" multiple>
                    <option th:each="e : ${employees}"
                            th:value="${e.id}"
                            th:text="${e.prenom + ' ' + e.nom}"
                            th:selected="${reunion.participants != null and reunion.participants.contains(e)}">
                    </option>
                </select>
                <small class="text-muted">
                    Maintenir Ctrl (Windows) / Cmd (Mac) pour sélectionner plusieurs employés
                </small>
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 mt-2">
                <a th:href="@{/manager/reunions}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Enregistrer
                </button>
            </div>

        </form>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>

</body>
</html>
