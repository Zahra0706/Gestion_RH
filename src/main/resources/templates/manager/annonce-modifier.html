<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="layouts/header :: head">
    <title>Modifier annonce - Manager</title>
</head>

<body>
<div th:replace="layouts/menu-manager :: sidebar"></div>

<main class="main-content">
    <div th:replace="layouts/header :: admin-header"></div>

    <div class="page-header mb-4">
        <h2><i class="fas fa-edit me-2"></i>Modifier une annonce</h2>
        <p class="text-muted" th:if="${departement != null}">
            Département : <b th:text="${departement.nom}"></b>
        </p>
    </div>

    <div class="chart-card">
        <h6 class="chart-title">Formulaire</h6>

        <form th:action="@{/manager/annonces/{id}/modifier(id=${annonce.id})}" method="post">
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Titre</label>
                    <input type="text" name="titre" class="form-control"
                           th:value="${annonce.titre}" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="t : ${types}"
                                th:value="${t}"
                                th:text="${t}"
                                th:selected="${t == annonce.type}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Contenu</label>
                <textarea name="contenu" class="form-control" rows="6" required
                          th:text="${annonce.contenu}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Enregistrer
            </button>
            <a th:href="@{/manager/annonces}" class="btn btn-secondary ms-2">Annuler</a>
        </form>
    </div>

    <div th:replace="layouts/footer :: admin-footer"></div>
</main>
</body>
</html>
