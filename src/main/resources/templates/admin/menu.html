<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<body>
    <!-- Sidebar Menu Fragment -->
    <div th:fragment="sidebar">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h3><i class="fas fa-users me-2"></i>HR<span>Manager</span></h3>
                <small class="text-muted">Panel d'Administration</small>
            </div>

            <nav class="sidebar-menu">
                <!-- Dashboard -->
                <a th:href="@{/admin/dashboard}" class="menu-item"
                    th:classappend="${requestURI != null && requestURI == '/admin/dashboard' ? 'active' : ''}">
                    <i class="fas fa-tachometer-alt"></i>
                    <span class="menu-text">Tableau de Bord</span>
                </a>

                <!-- Gestion des Employés -->
                <div class="menu-group">
                    <a th:href="@{/admin/employes}" class="menu-item d-flex justify-content-between align-items-center"
                        th:classappend="${requestURI != null && requestURI.startsWith('/admin/employes') ? 'active' : ''}">
                        <div>
                            <i class="fas fa-user-friends me-2"></i>
                            <span class="menu-text">Employés</span>
                        </div>
                        <span th:if="${menuCountEmployes != null}" class="badge bg-primary rounded-pill"
                            th:text="${menuCountEmployes}" style="font-size: 0.75rem;">0</span>
                    </a>
                </div>

                <!-- Gestion des Départements -->
                <div class="menu-group">
                    <a th:href="@{/admin/departements}"
                        class="menu-item d-flex justify-content-between align-items-center"
                        th:classappend="${requestURI != null && requestURI.startsWith('/admin/departements') ? 'active' : ''}">
                        <div>
                            <i class="fas fa-building me-2"></i>
                            <span class="menu-text">Départements</span>
                        </div>
                        <span th:if="${menuCountDepartements != null}" class="badge bg-success rounded-pill"
                            th:text="${menuCountDepartements}" style="font-size: 0.75rem;">0</span>
                    </a>
                </div>

                <!-- Gestion des Annonces -->
                <a th:href="@{/admin/annonces}" class="menu-item d-flex justify-content-between align-items-center"
                    th:classappend="${requestURI != null && requestURI.startsWith('/admin/annonces') ? 'active' : ''}">
                    <div>
                        <i class="fas fa-bullhorn me-2"></i>
                        <span class="menu-text">Annonces</span>
                    </div>
                    <span th:if="${menuCountAnnonces != null}" class="badge bg-warning rounded-pill"
                        th:text="${menuCountAnnonces}" style="font-size: 0.75rem;">0</span>
                </a>

                <!-- Statistiques -->
                <a th:href="@{/admin/statistiques}" class="menu-item"
                    th:classappend="${requestURI != null && requestURI.startsWith('/admin/statistiques') ? 'active' : ''}">
                    <i class="fas fa-chart-pie"></i>
                    <span class="menu-text">Statistiques</span>
                </a>

                <!-- Déconnexion -->
                <div class="menu-group mt-5">
                    <form th:action="@{/auth/logout}" method="post" class="menu-item logout-form">
                        <button type="submit" class="btn p-0 m-0 border-0 text-white">
                            <i class="fas fa-sign-out-alt"></i>
                            <span class="menu-text">Déconnexion</span>
                        </button>
                    </form>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="text-center text-muted py-1">
                    <small>© 2025 HR Manager</small><br>
                    <small>v1.0.0</small>
                </div>
            </div>
        </aside>
    </div>
</body>

</html>
