<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Footer Fragment -->
<div th:fragment="admin-footer">
    <footer class="footer mt-5 py-3 border-top">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-6">
                        <span class="text-muted">
                            © 2025 HR Manager - Système de Gestion des Ressources Humaines
                        </span>
                </div>
                <div class="col-md-6 text-end">
                        <span class="text-muted">
                            <i class="fas fa-shield-alt me-1"></i>
                            Sécurisé avec Spring Security
                        </span>
                </div>
            </div>
        </div>
    </footer>
</div>

<!-- Scripts Fragment -->
<div th:fragment="scripts">
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery (optional) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Custom Scripts -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Menu Toggle for Mobile
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle sidebar on mobile
            const menuToggle = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');

            if (menuToggle && sidebar) {
                menuToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('active');
                });
            }

            // Close submenus when clicking elsewhere
            document.addEventListener('click', function(event) {
                if (!event.target.closest('.sidebar') && !event.target.closest('.menu-toggle')) {
                    sidebar.classList.remove('active');
                }
            });

            // Logout form submission
            const logoutForms = document.querySelectorAll('.logout-form');
            logoutForms.forEach(form => {
                form.addEventListener('submit', function(e) {
                    if (!confirm('Êtes-vous sûr de vouloir vous déconnecter ?')) {
                        e.preventDefault();
                    }
                });
            });

            // Auto-dismiss alerts
            const alerts = document.querySelectorAll('.alert:not(.alert-permanent)');
            alerts.forEach(alert => {
                setTimeout(() => {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }, 5000);
            });
        });

        // Initialize Charts
        function initCharts() {
            // Distribution par rôle - CORRECTION ICI
            const roleCtx = document.getElementById('roleChart');
            if (roleCtx) {
                /*[[${statistiquesParRole}]]*/ // Thymeleaf comment
                const roleData = /*[[${statistiquesParRole}]]*/ null;
                if (roleData) {
                    new Chart(roleCtx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(roleData),
                            datasets: [{
                                data: Object.values(roleData),
                                backgroundColor: [
                                    '#3498db', '#2ecc71', '#e74c3c',
                                    '#f39c12', '#9b59b6', '#1abc9c'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                }
            }

            // Employés par département - CORRECTION ICI
            const deptCtx = document.getElementById('departementChart');
            if (deptCtx) {
                /*[[${employesParDepartement}]]*/ // Thymeleaf comment
                const deptData = /*[[${employesParDepartement}]]*/ null;
                if (deptData) {
                    new Chart(deptCtx, {
                        type: 'bar',
                        data: {
                            labels: Object.keys(deptData),
                            datasets: [{
                                label: 'Nombre d\'employés',
                                data: Object.values(deptData),
                                backgroundColor: 'rgba(52, 152, 219, 0.7)',
                                borderColor: 'rgba(52, 152, 219, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1
                                    }
                                }
                            }
                        }
                    });
                }
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initCharts);
        /*]]>*/
    </script>
</div>
</body>
</html>
